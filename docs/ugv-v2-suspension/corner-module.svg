<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="680" viewBox="0 0 1150 680" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect width="1150" height="680" fill="#ffffff"/>
  <text x="575" y="30" text-anchor="middle" font-size="19" font-weight="bold">Вузол одного кута: мотор KKW5T2 + кулак + важелі (ширина машини 900)</text>

  <!-- ================= PANEL A: TOP VIEW ================= -->
  <text x="330" y="70" text-anchor="middle" font-size="16" font-weight="bold">Вид ЗВЕРХУ на лівий кут (1 px = 1 мм)</text>
  <text x="90" y="95" font-size="12" fill="#666">← назовні (борт)</text>
  <text x="640" y="95" text-anchor="end" font-size="12" fill="#666">до центру машини →</text>

  <!-- wheel (rotating) -->
  <rect x="200" y="140" width="130" height="370" rx="30" fill="#c8e6c9" stroke="#1e8449" stroke-width="2.5"/>
  <text x="265" y="132" text-anchor="middle" fill="#1e8449" font-size="12">колесо Ø370×130</text>

  <!-- motor housing (rotating): flange mid-wheel, body to 215 from outer edge -->
  <rect x="277" y="253" width="138" height="144" rx="10" fill="#a5d6a7" stroke="#1e8449" stroke-width="2.5"/>
  <text x="346" y="315" text-anchor="middle" font-size="12" fill="#14532d">корпус мотора</text>
  <text x="346" y="331" text-anchor="middle" font-size="12" fill="#14532d">Ø144 × 137,5</text>
  <text x="346" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">ОБЕРТАЄТЬСЯ ↻</text>

  <!-- brake disc seat (rotating, unused) on inboard face of housing -->
  <rect x="415" y="301" width="7" height="48" fill="#a5d6a7" stroke="#1e8449" stroke-width="1.5"/>
  <text x="355" y="112" font-size="11" fill="#1e8449">посадка гальм. диска (Ø44, 6×Ø5) —</text>
  <text x="355" y="126" font-size="11" fill="#1e8449">на корпусі, що обертається. НЕ використовуємо</text>
  <line x1="400" y1="131" x2="419" y2="298" stroke="#1e8449" stroke-width="1" marker-end="url(#arr)"/>

  <!-- fixed shaft O24.8 x 58 (red) -->
  <rect x="422" y="313" width="58" height="25" fill="#f5b7b1" stroke="#b03a2e" stroke-width="2.5"/>
  <line x1="439" y1="316" x2="480" y2="316" stroke="#b03a2e" stroke-width="2"/>
  <text x="420" y="516" font-size="12" font-weight="bold" fill="#b03a2e">НЕРУХОМИЙ вал Ø24,8 з лискою —</text>
  <text x="420" y="531" font-size="12" fill="#b03a2e">єдине, що з'єднує мотор з кулаком</text>
  <line x1="428" y1="508" x2="433" y2="342" stroke="#b03a2e" stroke-width="1" marker-end="url(#arrR)"/>

  <!-- upright boss (blue) clamping last 32 mm of shaft -->
  <rect x="448" y="295" width="32" height="60" fill="#aed6f1" stroke="#1f4e79" stroke-width="2.5"/>
  <!-- upright plate 10mm -->
  <rect x="480" y="245" width="10" height="160" fill="#5dade2" stroke="#1f4e79" stroke-width="2.5"/>
  <!-- clamp bolts M8 -->
  <circle cx="464" cy="287" r="5" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="464" cy="363" r="5" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
  <text x="420" y="551" font-size="12" fill="#1f4e79">кулак: бош 30–35 мм + пластина 10 мм,</text>
  <text x="420" y="566" font-size="12" fill="#1f4e79">стяжка 2×M8 — затискає вал по лисці</text>
  <line x1="470" y1="543" x2="486" y2="408" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>

  <!-- A-arm top view: apex ball joint at (497,325), pivots at (622, 237/413) -->
  <g stroke="#7f8c8d" stroke-width="6" stroke-linecap="round">
    <line x1="497" y1="325" x2="622" y2="237"/>
    <line x1="497" y1="325" x2="622" y2="413"/>
  </g>
  <circle cx="497" cy="325" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="622" cy="237" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="622" cy="413" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="420" y="588" font-size="12" fill="#555">А-важіль (вид зверху; під ним другий такий самий): зовні ШС-12, всередині осі M12</text>
  <line x1="545" y1="580" x2="568" y2="372" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- frame spine -->
  <rect x="622" y="160" width="75" height="330" fill="#eef3f8" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="660" y="325" text-anchor="middle" font-size="12" fill="#1f4e79" transform="rotate(-90 660 325)">гребінь 100 мм (поздовжній)</text>

  <!-- dim: shaft protrusion 58 -->
  <line x1="422" y1="343" x2="422" y2="480" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="480" y1="410" x2="480" y2="480" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="422" y1="475" x2="480" y2="475" stroke="#333" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="451" y="493" text-anchor="middle" font-size="12">58</text>

  <!-- dim: 215 from outer wheel edge to motor end -->
  <line x1="200" y1="512" x2="200" y2="645" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="422" y1="485" x2="422" y2="645" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="200" y1="640" x2="422" y2="640" stroke="#333" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="311" y="658" text-anchor="middle" font-size="12">215 (ваш замір: край колеса → торець мотора)</text>

  <!-- dim: arm 125 -->
  <line x1="497" y1="325" x2="497" y2="210" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="622" y1="237" x2="622" y2="210" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="497" y1="215" x2="622" y2="215" stroke="#333" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="560" y="208" text-anchor="middle" font-size="12">важіль 125 (ефективна)</text>

  <!-- ================= PANEL B: VIEW ALONG SHAFT AXIS ================= -->
  <text x="890" y="70" text-anchor="middle" font-size="16" font-weight="bold">Вид на кулак УЗДОВЖ осі вала (зсередини машини)</text>

  <!-- wheel dashed -->
  <circle cx="890" cy="330" r="185" fill="none" stroke="#1e8449" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="890" y="135" text-anchor="middle" font-size="12" fill="#1e8449">колесо Ø370 (за кулаком)</text>
  <!-- motor dashed -->
  <circle cx="890" cy="330" r="72" fill="none" stroke="#1e8449" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="975" y="282" font-size="12" fill="#1e8449">корпус Ø144</text>

  <!-- upright plate -->
  <path d="M862,238 h56 a10,10 0 0 1 10,10 v164 a10,10 0 0 1 -10,10 h-56 a10,10 0 0 1 -10,-10 v-164 a10,10 0 0 1 10,-10 z"
        fill="#aed6f1" stroke="#1f4e79" stroke-width="2.5"/>
  <!-- slit of split clamp -->
  <line x1="890" y1="348" x2="890" y2="422" stroke="#ffffff" stroke-width="3"/>
  <line x1="890" y1="348" x2="890" y2="422" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- clamp bolts across slit -->
  <circle cx="874" cy="385" r="5" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="906" cy="385" r="5" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
  <line x1="874" y1="385" x2="906" y2="385" stroke="#1f4e79" stroke-width="1.5"/>

  <!-- D-hole with flat (shaft cross-section) -->
  <path d="M898,318.5 a14,14 0 1 0 0.001,23 z" fill="#f5b7b1" stroke="#b03a2e" stroke-width="2.5"/>
  <line x1="898" y1="318.5" x2="898" y2="341.5" stroke="#b03a2e" stroke-width="2.5"/>

  <!-- rod-end holes -->
  <circle cx="890" cy="252" r="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <circle cx="890" cy="408" r="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="760" y="235" font-size="12">ШС-12 — верхній важіль</text>
  <line x1="848" y1="240" x2="880" y2="250" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <text x="760" y="445" font-size="12">ШС-12 — нижній важіль</text>
  <line x1="848" y1="438" x2="880" y2="412" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>

  <!-- dim 150 between rod ends -->
  <line x1="948" y1="252" x2="948" y2="408" stroke="#333" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="898" y1="252" x2="944" y2="252" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="898" y1="408" x2="944" y2="408" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="956" y="334" font-size="12">150</text>

  <!-- D-hole label -->
  <text x="990" y="360" font-size="12" fill="#b03a2e">D-отвір Ø25:</text>
  <text x="990" y="375" font-size="12" fill="#b03a2e">плоска стінка впирається</text>
  <text x="990" y="390" font-size="12" fill="#b03a2e">в лиску → вал не крутиться</text>
  <line x1="987" y1="355" x2="906" y2="333" stroke="#b03a2e" stroke-width="1" marker-end="url(#arrR)"/>
  <!-- slit label -->
  <text x="990" y="420" font-size="12" fill="#1f4e79">розріз + 2×M8 —</text>
  <text x="990" y="435" font-size="12" fill="#1f4e79">затискання/осьова фіксація</text>
  <line x1="987" y1="415" x2="912" y2="390" stroke="#1f4e79" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ================= LEGEND ================= -->
  <rect x="700" y="600" width="430" height="70" fill="#fafafa" stroke="#ccc"/>
  <rect x="712" y="608" width="16" height="16" fill="#a5d6a7" stroke="#1e8449" stroke-width="2"/>
  <text x="736" y="621" font-size="12">обертається (колесо + корпус мотора)</text>
  <rect x="712" y="628" width="16" height="16" fill="#f5b7b1" stroke="#b03a2e" stroke-width="2"/>
  <text x="736" y="641" font-size="12">нерухомий вал Ø24,8 з лискою</text>
  <rect x="712" y="648" width="16" height="16" fill="#aed6f1" stroke="#1f4e79" stroke-width="2"/>
  <text x="736" y="661" font-size="12">кулак (ходить вгору-вниз на важелях)</text>
</svg>
